[package]
name = "alpha7"
version = "2.2.0"
edition = "2021"
description = "Alpha 7 v2.2.0: Pure-Rust Embodied Cortical-Hippocampal & Sovereign Quantum AI (Live Move-by-Move 7-Day 14-Game Mastery Arcade, 4-Cell 6-Ply Apical Fission-Fusion, Two-Process Borbely Homeostatic + Circadian Sleep, Dynamic Hardware-Adaptive Body, and Unified Thalamo-Cortical Sensory Stream)"

[lib]
name = "alpha7"
