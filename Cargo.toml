[package]
name = "alpha7"
version = "3.0.0"
edition = "2021"
description = "Alpha 7 v3.0.0: Pure-Rust Embodied Cortical-Hippocampal & Sovereign Quantum AI (Unified Self-Mutating Cortical Brain with E0-E11 Constitutional Judge, The Sovereign Crucible Multi-Path Detour Game, Context-Rotated Subspace Mental Lines, and 15Hz Commitment-Gated Rivalry)"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
path = "src/bin/alpha7.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
