[package]
name = "alpha7"
version = "2.0.0"
edition = "2021"
description = "Alpha 7 v2.0.0: Pure-Rust Embodied Cortical-Hippocampal & Sovereign Quantum AI (Dynamic Hardware-Adaptive Body, Unified Thalamo-Cortical Continuous Sensory Stream, Multicellular Fission-Fusion Chess & Procedural 9x9 Sudoku, Foveated 1:1 Retina, Video/Audio Stream, Chaos Root Prover, and Bio-Stabilized LDM)"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
path = "src/bin/alpha7.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
