[package]
name = "alpha7"
version = "3.2.0"
edition = "2021"
license = "MIT"
readme = "README.md"
repository = "https://github.com/pro-aras/alpha-brain"
keywords = ["neuromorphic", "spiking-neural-net", "predictive-coding", "btsp", "alife"]
categories = ["science::neuroscience", "simulation", "algorithms"]
description = "Alpha 7 v3.2.0: Pure-Rust Embodied Cortical-Hippocampal & ALife Autopoietic Cognitive Engine (3-Compartment Dendritic Predictive Coding, 1-2 Shot BTSP Concept Cells, 4D Thermal-Chemical Field, Multi-Path Conductive Flux, and E0-E17 Constitutional Judge)"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
path = "src/bin/alpha7.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
