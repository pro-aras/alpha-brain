[package]
name = "alpha7"
version = "0.3.0"
edition = "2021"
description = "Alpha 7: Pure-Rust Embodied Sparse Dendritic AI, V1/V2 Scene Segmentation, Cortical Sequence Memory, Live vs. Null-Twin Exam Harness, Code Synthesizer & Multi-Step Tool Planning"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
path = "src/bin/alpha7.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
