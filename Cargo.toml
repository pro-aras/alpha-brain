[package]
name = "alpha7"
version = "0.1.0"
edition = "2021"
description = "Alpha 7: Pure-Rust Embodied Sparse Dendritic AI, 1-2 Shot Concept Web, Predictive Engine, Grounded Mouth & 2D World Canvas"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
path = "src/bin/alpha7.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
