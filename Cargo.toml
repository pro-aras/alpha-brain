[package]
name = "alpha7"
version = "1.9.0"
edition = "2021"
description = "Alpha 7 v1.9.0: Pure-Rust Embodied Cortical-Hippocampal & Sovereign Quantum AI (Foveated 1:1 Retina + Browser Eye, Synchronized Video/Audio Stream, Unorganized Chaos Self-Organizer & Root Prover across K->PhD, Bio-Stabilized Bidirectional LDM, and Multilingual HybridLink)"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
path = "src/bin/alpha7.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustc-hash = "2.1"
smallvec = { version = "1.13", features = ["serde"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "pnm"] }
