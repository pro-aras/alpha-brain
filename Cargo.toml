[package]
name = "alpha7"
version = "2.3.0"
edition = "2021"
description = "Alpha 7 v2.3.0: Pure-Rust Embodied Cortical-Hippocampal & Sovereign Quantum AI (Unified Self-Mutating Cortical Brain with E0-E10 Constitutional Judge, 15Hz Conscious/Suppressed Temporal Multiplexing, Premotor Geometric Mental Line Deductive Reasoning, and Live 14-Game Mastery Arena)"

[lib]
name = "alpha7"
path = "src/lib.rs"

[[bin]]
name = "alpha7"
