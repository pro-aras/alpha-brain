# SEAT-LINE sha256 1d00a35f…): brain-long-5's memory fence, byte-identical to brain-long-4's own
# (~/.config/systemd/user/creature-brain@brain-long-4.service.d/fence.conf, the launch_long.sh form).
# Install: ~/.config/systemd/user/creature-brain@brain-long-5.service.d/fence.conf (launch_long.sh writes these
# same bytes itself at the launch; this copy is the packet's record of them).
# the long life's memory fence: the box has 30 GB; GROW is unbounded. At MemoryHigh the kernel reclaims and slows the life;
# at MemoryMax it is killed and the unit restarts it from its last snapshot (Restart=on-failure).
[Service]
MemoryHigh=16G
MemoryMax=20G
