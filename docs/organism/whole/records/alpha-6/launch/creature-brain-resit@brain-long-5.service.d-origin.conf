ExecStart=
ExecStart=/usr/bin/python3 -B -I /data/dev/genome/tools/brain/resit.py run --mode daily --root /data/dev/genome-lives/%i --code /data/dev/genome-lives/%i/code --items-root /data/dev/genome-lives/brain-long-4 --grader-code /data/dev/brain-runs/resit/grader-<LAUNCH_SHA> --out /data/dev/brain-runs/resit/%i --scored /data/dev/brain-runs/scene-s1b1r --status /data/dev/genome-lives/%i/STATUS.json
