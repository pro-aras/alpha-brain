# /home/ahmad/.config/systemd/user/creature-brain-resit@brain-long-6.service.d/origin.conf
# edit: Kimi Code (K3, kimi-code, the seat alone), 2026-10-12 01:08 +0400 — PREREG-BRAIN-LONG-6 (SIGNED;
# SEAT-LINE sha256 2c6bb22b…): brain-long-6's ORIGIN for the daily resit — the launch packet §2 item 3, the
# same form as brain-long-5's (~/.config/systemd/user/creature-brain-resit@brain-long-5.service.d/origin.conf).
# The stock creature-brain-resit@.service hardcodes --items-root brain-long-2 (brain-long-3's origin); the
# ladder (RULES §3) makes brain-long-6's origin brain-long-5. The empty ExecStart= clears the template's,
# then the same line with the two bl6 values: items-root /data/dev/genome-lives/brain-long-5, grader-code
# the LAUNCH sha's checkout (grader-ce628fa prepared first). The resit timer is enabled only after this
# drop-in verifies (systemctl --user cat); if the drop-in is not written, the timer is NOT enabled (it would
# grade against the wrong origin); the life itself does not need it to live.
[Service]
ExecStart=
ExecStart=/usr/bin/python3 -B -I /data/dev/genome/tools/brain/resit.py run --mode daily --root /data/dev/genome-lives/%i --code /data/dev/genome-lives/%i/code --items-root /data/dev/genome-lives/brain-long-5 --grader-code /data/dev/brain-runs/resit/grader-ce628fa --out /data/dev/brain-runs/resit/%i --scored /data/dev/brain-runs/scene-s1b1r --status /data/dev/genome-lives/%i/STATUS.json
